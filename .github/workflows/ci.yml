name: quality

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up supported Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Set up supported Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm

      - name: Install frontend build dependencies
        run: npm ci

      - name: Run quality gates
        run: bash scripts/test.sh

      - name: Scan Go dependencies and standard library
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
