<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Lodge</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <header>
    <h1>Lodge</h1>
    <span class="sub" id="updated"></span>
    <button id="logoutBtn" class="hidden" type="button">退出</button>
  </header>

  <section id="login" class="hidden" aria-labelledby="loginTitle">
    <div class="card login-card">
      <h2 id="loginTitle" class="login-title">Lodge 登录</h2>
      <label for="pw">密码</label>
      <input type="password" id="pw" placeholder="输入访问密码" autocomplete="current-password">
      <button id="loginBtn" class="primary" type="button">进入</button>
      <p class="err hidden" id="loginErr" role="alert">密码错误或暂时无法登录</p>
    </div>
  </section>

  <main id="dash" class="hidden">
    <section class="machines" id="machines" aria-label="服务器概览"></section>
    <section id="services" aria-label="服务目录"></section>
  </main>
</body>
</html>
