<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lodge</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --dim: #8b949e;
    --public: #f85149; --tailnet: #58a6ff; --local: #6e7681; --other: #d29922;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; flex: 1; }
  header button { background: none; border: 1px solid var(--border); color: var(--dim); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .machines { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .card .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.on { background: #3fb950; } .dot.off { background: var(--public); }
  .card .stats { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; color: var(--dim); font-size: 12px; }
  .card .stats b { color: var(--text); font-weight: 500; }
  .warn { color: var(--public); }
  h2 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; margin: 28px 0 10px; }
  .svc-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .svc-row:last-child { border-bottom: none; }
  .svc-row.public { background: rgba(248,81,73,.08); }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .badge.public { background: var(--public); color: #fff; }
  .badge.tailnet { background: var(--tailnet); color: #fff; }
  .badge.local { background: var(--local); color: #fff; }
  .badge.other { background: var(--other); color: #fff; }
  .svc-name { font-weight: 500; min-width: 140px; }
  .svc-name a { color: var(--tailnet); text-decoration: none; }
  .svc-name a:hover { text-decoration: underline; }
  .svc-kind { color: var(--dim); font-size: 11px; }
  .ports { color: var(--dim); font-family: ui-monospace, monospace; font-size: 12px; flex: 1; }
  .ports .p { margin-right: 8px; }
  .edit { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; }
  .edit:hover { color: var(--text); background: var(--border); }
  .empty { color: var(--dim); padding: 20px; text-align: center; }
  .err { color: var(--public); font-size: 12px; }
  /* 登录页 */
  #login { max-width: 320px; margin: 80px auto; }
  #login .card { padding: 24px; }
  #login label { display: block; color: var(--dim); font-size: 12px; margin-bottom: 6px; }
  #login input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 9px 11px; border-radius: 6px; font-size: 14px; }
  #login button { margin-top: 14px; width: 100%; background: #238636; border: none; color: #fff; padding: 9px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
  #login .err { margin-top: 10px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>Lodge</h1>
  <span class="sub" id="updated"></span>
  <button id="logoutBtn" class="hidden" onclick="doLogout()">退出</button>
</header>

<!-- 登录页 -->
<div id="login" class="hidden">
  <div class="card">
    <div class="name" style="margin-bottom:16px">🔒 Lodge 登录</div>
    <label>密码</label>
    <input type="password" id="pw" placeholder="输入访问密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">进入</button>
    <div class="err hidden" id="loginErr">密码错误</div>
  </div>
</div>

<!-- 仪表盘 -->
<main id="dash" class="hidden">
  <div class="machines" id="machines"></div>
  <div id="services"></div>
</main>

<script>
const exposureLabel = {public:'公网', tailnet:'内网', local:'本机', other:'待定'};
const exposureOrder = {public:0, other:1, tailnet:2, local:3};
let AUTHED = false;

async function get(url, opts){
  const r = await fetch(url, opts);
  if(r.status === 401){ AUTHED = false; showLogin(); throw new Error('unauthorized'); }
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

// ── 登录 ──────────────────────────────────────────
function showLogin(){ document.getElementById('login').classList.remove('hidden'); document.getElementById('dash').classList.add('hidden'); document.getElementById('logoutBtn').classList.add('hidden'); }
function showDash(){ document.getElementById('login').classList.add('hidden'); document.getElementById('dash').classList.remove('hidden'); document.getElementById('logoutBtn').classList.remove('hidden'); }

async function boot(){
  try {
    const s = await get('/api/session');
    AUTHED = s.authed;
    if(AUTHED){ showDash(); refresh(); setInterval(refresh, 10000); }
    else showLogin();
  } catch(e){ showLogin(); }
}
async function doLogin(){
  const pw = document.getElementById('pw').value;
  document.getElementById('loginErr').classList.add('hidden');
  try {
    await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password:pw})});
    const s = await get('/api/session');
    if(s.authed){ AUTHED = true; document.getElementById('pw').value=''; showDash(); refresh(); setInterval(refresh,10000); }
    else document.getElementById('loginErr').classList.remove('hidden');
  } catch(e){ document.getElementById('loginErr').classList.remove('hidden'); }
}
async function doLogout(){ await fetch('/api/logout',{method:'POST'}); AUTHED=false; showLogin(); }

// ── 仪表盘 ────────────────────────────────────────
async function refresh(){
  if(!AUTHED) return;
  try {
    const [agents, services] = await Promise.all([get('/api/agents'), get('/api/services')]);
    renderMachines(agents);
    renderServices(services);
    document.getElementById('updated').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
  } catch(e) {
    document.getElementById('updated').innerHTML = '<span class="err">加载失败: '+esc(e.message)+'</span>';
  }
}
function renderMachines(agents){
  document.getElementById('machines').innerHTML = agents.map(a => `
    <div class="card">
      <div class="name"><span class="dot ${a.online?'on':'off'}"></span>${esc(a.name)}</div>
      <div class="stats">
        <span>负载 <b>${(a.load1||0).toFixed(2)} / ${a.cpus||'-'}</b></span>
        <span>内存 <b>${a.memUsedPct||0}%</b></span>
        <span>磁盘 <b>${a.diskUsedPct||0}%</b></span>
        <span>服务 <b>${a.serviceCount}</b>${a.publicCount?`<span class="warn"> ⚠${a.publicCount}公网</span>`:''}</span>
      </div>
      ${!a.online && a.lastError ? `<div class="err" style="margin-top:8px">${esc(a.lastError).slice(0,80)}</div>`:''}
    </div>`).join('');
}
function renderServices(groups){
  document.getElementById('services').innerHTML = groups.map(g => {
    const svcs = g.services.slice().sort((a,b)=>(exposureOrder[a.maxExposure]??9)-(exposureOrder[b.maxExposure]??9));
    const rows = svcs.length ? svcs.map(s => {
      const disp = esc(s.alias||s.name);
      const name = s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${disp} ↗</a>` : disp;
      return `<div class="svc-row ${s.maxExposure==='public'?'public':''}">
        <span class="badge ${s.maxExposure}">${exposureLabel[s.maxExposure]||s.maxExposure}</span>
        <span class="svc-name">${name}${s.unidentified?' <span class="err">?</span>':''}</span>
        <span class="svc-kind">${s.kind}</span>
        <span class="ports">${(s.ports||[]).map(p=>`<span class="p">${esc(p.bind)}:${p.port}</span>`).join('')}</span>
        <button class="edit" title="设置访问链接" onclick="editURL('${esc(g.agent.id)}','${esc(s.key)}','${esc(s.url||'')}')">✎</button>
      </div>`;
    }).join('') : '<div class="empty">无服务</div>';
    return `<h2>${esc(g.agent.name)} ${g.agent.online?'':'<span class="err">· 离线</span>'}</h2><div class="card" style="padding:0">${rows}</div>`;
  }).join('');
}
async function editURL(agent, key, cur){
  const url = prompt('设置「'+key+'」的访问链接（留空清除）:', cur);
  if(url === null) return;
  try {
    await get('/api/annotation?agent='+encodeURIComponent(agent)+'&key='+encodeURIComponent(key), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({url: url.trim()})
    });
    refresh();
  } catch(e){ alert('保存失败: '+e.message); }
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

boot();
</script>
</body>
</html>
